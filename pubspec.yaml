name: mercadopago_sdk
description: Official MercadoPago SDK for Flutter — card tokenization, payment methods, installments, and complete checkout UI for Latin America.
version: 0.1.0
homepage: https://github.com/mercadopago/sdk-flutter
repository: https://github.com/mercadopago/sdk-flutter
issue_tracker: https://github.com/mercadopago/sdk-flutter/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4

flutter:
  plugin:
    platforms:
      android:
        package: com.mercadopago.sdk
        pluginClass: MercadopagoSdkPlugin
      ios:
        pluginClass: MercadopagoSdkPlugin

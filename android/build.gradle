group 'com.mercadopago.sdk'
version '0.1.0'

buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.mercadopago.sdk'
    compileSdk 34

    defaultConfig {
        minSdk 23
        consumerProguardFiles 'proguard-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // MercadoLibre device-fingerprint library. The host app declares the
    // MercadoLibre Artifactory in dependencyResolutionManagement (see README
    // → Android setup); this plugin does not mutate root-project repositories.
    implementation 'com.mercadolibre.android.device:sdk:4.0.1'

    // Gson serialises the Device object into a Map<String, Any?> that can
    // travel across the Flutter MethodChannel.
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'junit:junit:4.13.2'
}

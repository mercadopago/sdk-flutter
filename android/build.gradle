group 'com.mercadopago.sdk'
version '0.1.0'

buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.mercadopago.sdk'
    compileSdk 34

    defaultConfig {
        minSdk 23
        consumerProguardFiles 'proguard-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // The Mercado Libre device-fingerprint library is loaded reflectively
    // when present. It is intentionally NOT a hard dependency so the plugin
    // builds in environments where the artifact is unavailable.
    compileOnly 'com.mercadolibre.android:device:4.0.1'
}

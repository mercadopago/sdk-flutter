group 'com.mercadopago.sdk'
version '0.1.0'

buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://artifacts.mercadolibre.com/repository/android-releases'
            // Restrict this repo to MercadoLibre device SDK artifacts only,
            // so Gradle never queries it for unrelated dependencies.
            content {
                includeGroup 'com.mercadolibre.android.device'
            }
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.mercadopago.sdk'
    compileSdk 34

    defaultConfig {
        minSdk 23
        consumerProguardFiles 'proguard-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // MercadoLibre device-fingerprint library. Resolved from the public
    // MercadoLibre Artifactory declared in repositories above. The host app
    // must mirror that repository declaration in its settings.gradle (see
    // README → Android setup).
    implementation 'com.mercadolibre.android.device:sdk:4.0.1'

    // Gson serialises the Device object into a Map<String, Any?> that can
    // travel across the Flutter MethodChannel.
    implementation 'com.google.code.gson:gson:2.10.1'
}

group 'com.mercadopago.sdk'
version '0.1.0'

buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.mercadopago.sdk'
    compileSdk 34

    defaultConfig {
        minSdk 23
        consumerProguardFiles 'proguard-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Device fingerprint AAR — bundled directly so integrators do not need
    // access to the private MercadoLibre Maven repository. Mirrors the
    // iOS plugin, which bundles DeviceFingerPrint.xcframework under
    // ios/Frameworks/.
    implementation fileTree(dir: 'libs', include: ['*.aar'])

    // Gson is used to serialise the Device object into a Map<String, Any?>
    // that can travel across the Flutter MethodChannel.
    implementation 'com.google.code.gson:gson:2.10.1'
}
